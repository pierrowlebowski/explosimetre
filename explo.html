<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Explosimètre — écran</title>
<link rel="stylesheet" href="css/commun.css">
<link rel="stylesheet" href="css/explo.css">
</head>
<body data-alarme="0">

  <div class="etat">
    <span class="voyant" id="voyant"></span>
    <span id="texteEtat">Connexion…</span>
  </div>

  <div class="detecteur">
    <div class="bandeau"><span class="lueur" id="lueur"></span></div>

    <div class="cadre">
      <div class="lcd">
        <span class="retro" id="retro"></span>

        <!-- Bandeau du haut : LOW/HIGH ALARM, ou l'écran des valeurs crêtes -->
        <div class="tete" id="tete">
          <span class="mention" id="mention"></span>
          <span class="fanion" id="fanion"></span>
        </div>

        <!-- Une case par gaz : les identifiants v-… et l-… viennent de config.js -->
        <div class="case gauche">
          <div class="valeur" id="v-h2s"></div>
          <div class="libelle" id="l-h2s">H<sub>2</sub>S ppm</div>
        </div>

        <div class="case">
          <div class="valeur" id="v-co"></div>
          <div class="libelle" id="l-co">CO ppm</div>
        </div>

        <div class="case gauche">
          <div class="valeur" id="v-o2"></div>
          <div class="libelle" id="l-o2">O<sub>2</sub> % <span class="pile"><i></i></span></div>
        </div>

        <div class="case">
          <div class="valeur" id="v-lel"></div>
          <div class="libelle" id="l-lel">LEL%</div>
        </div>
      </div>
    </div>

    <div class="plaque">
      <span class="bw">TDT</span>
      <span class="nom"><b>G</b>as<b>A</b>lertdu<b>T</b>urfu<b>3.3</b></span>
    </div>

    <div class="commandes">
      <div class="vis"></div>
      <button class="bouton" id="bouton"
              aria-label="Bouton — appui court : rétroéclairage, double appui : valeurs crêtes, appui long : sourdine"></button>
    </div>

    <div class="capteurs">
      <div class="anneau"></div>
      <div class="trou hg"></div><div class="trou hd"></div>
      <div class="trou bg"></div><div class="trou bd"></div>
    </div>
  </div>

  <div class="pied" id="pied">
    Appui court sur le bouton bleu : rétroéclairage. Double appui : valeurs crêtes.
    Appui long : sourdine.
  </div>

  <div class="pied avertissement" id="avertVeille" hidden></div>

  <div class="voile" id="voile">
    <h1>Explosimètre d'exercice</h1>
    <p>Touchez pour démarrer. Le son des alarmes ne peut être joué qu'après une action de votre part.</p>
    <button id="demarrer">Démarrer l'appareil</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/mesure.js"></script>
  <script src="js/liaison.js"></script>
  <script src="js/afficheur.js"></script>
  <script src="js/son.js"></script>
  <script src="js/veille.js"></script>
  <script src="js/explo.js"></script>
</body>
</html>
